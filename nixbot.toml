# nixbot on homelab (modules/nixos/nixbot.nix) builds checks.x86_64-linux on
# main, on pull requests, and, from this list, on luvus/integration and task
# branches, whose `nixbot/nix-eval` and `nixbot/nix-build` checks the
# main-checks ruleset requires. nixbot reads build_branches from main's copy
# of this file only. It roots only what branches.topics in that module
# matches, so change the two globs together.
build_branches = ["luvus/*"]
