name: nix-ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkmate:
    name: Checkmate formatting and unit-test skeleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
  headless-system:
    name: build headless NixOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build headless system
        run: nix --accept-flake-config build .#nixosConfigurations.asus-headless.config.system.build.toplevel --print-build-logs
  desktop-system:
    name: build NixOS (shell and compositor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build desktop system
        run: nix --accept-flake-config build .#nixosConfigurations.asus.config.system.build.toplevel --print-build-logs
  home-manager:
    name: build Home Manager modules (shell, editor, and desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build Home Manager modules
        run: nix --accept-flake-config build .#checks.x86_64-linux.home-manager-nixos --print-build-logs
  config-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: niri compositor config
            command: build .#checks.x86_64-linux.niri-config --print-build-logs
          - name: zellij shell config
            command: build .#checks.x86_64-linux.zellij-config --print-build-logs
          - name: whitespace
            command: build .#checks.x86_64-linux.whitespace --print-build-logs
    steps:
      - uses: actions/checkout@v6
      - name: Free runner disk space
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build ${{ matrix.name }}
        run: nix --accept-flake-config ${{ matrix.command }}
