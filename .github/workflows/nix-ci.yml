name: nix-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: nix fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21
        with:
          kvm: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check formatting
        run: |
          nix fmt
          git diff --exit-code

  flake-check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21
        with:
          kvm: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run flake checks
        run: nix flake check
