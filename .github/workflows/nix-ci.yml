name: nix-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home manager (shell, editor, and desktop)
            command: nix eval --raw .#homeConfigurations.schlich.activationPackage.drvPath
          - name: NixOS (shell and compositor)
            command: nix build .#nixosConfigurations.asus.config.system.build.toplevel --print-build-logs
          - name: niri compositor config
            command: nix build .#checks.x86_64-linux.niri-config --print-build-logs
          - name: zellij shell config
            command: nix build .#checks.x86_64-linux.zellij-config --print-build-logs
          - name: whitespace
            command: nix build .#checks.x86_64-linux.whitespace --print-build-logs
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
        with:
          extra-conf: |
            extra-substituters = https://noctalia.cachix.org https://yazelix.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= yazelix.cachix.org-1:ZgxIjQvaP0VTWL8Racx27mpUNzDJ97xC2y7QWYjmGNM=
      - name: Enable FlakeHub Cache
        if: matrix.name == 'NixOS (shell and compositor)'
        uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.command }}
