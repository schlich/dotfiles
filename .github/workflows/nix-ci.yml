name: nix-ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect affected CI checks
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.changed.outputs.nix }}
      home: ${{ steps.changed.outputs.home }}
      niri: ${{ steps.changed.outputs.niri }}
      zellij: ${{ steps.changed.outputs.zellij }}
      checkmate: ${{ steps.changed.outputs.checkmate }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: changed
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: |
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]]; then
            DIFF_BASE=HEAD^
          fi
          git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/changed-paths"
          mapfile -d '' changed_files < "$RUNNER_TEMP/changed-paths"

          nix=false
          home=false
          niri=false
          zellij=false
          checkmate=false
          run_all() {
            nix=true
            home=true
            niri=true
            zellij=true
            checkmate=true
          }
          # Pushes to main are the post-merge backstop for scoped PR runs.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_EVENT_NAME" == push ]]; then
            run_all
          fi
          if ((${#changed_files[@]} == 0)); then
            run_all
          fi
          for file in "${changed_files[@]}"; do
            case "$file" in
              .github/workflows/*|flake.nix|flake.lock) run_all ;;
              niri/*) niri=true ;;
              zellij/*) zellij=true ;;
              *.md|*.mdx|*.yaml|*.yml|docs/*) checkmate=true ;;
              # Imported only through the user-terminal Home Manager aspect;
              # no NixOS module, headless host, or other check reads them.
              modules/home/*|modules/programs/*|modules/tooling/*|den/aspects/users/terminal.nix|\
              .agents/*|agent/*|config.nu|copilot/*|helix/*|jev/*|nushell/*|plugins/*|wallpapers/*)
                home=true
                checkmate=true
                ;;
              *) run_all ;;
            esac
          done

          {
            echo "nix=$nix"
            echo "home=$home"
            echo "niri=$niri"
            echo "zellij=$zellij"
            echo "checkmate=$checkmate"
          } >> "$GITHUB_OUTPUT"
  impact:
    # Every commit carries an Impact trailer; a refactor must leave every
    # NixOS closure identical to the merge base. Queue and main runs were
    # already classified on their pull request.
    name: impact classification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Classify and verify the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: nix run --inputs-from . nixpkgs#nushell -- jj/ci.nu impact check "$BASE" "$HEAD"
  checkmate:
    name: Checkmate formatting and unit-test skeleton
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.checkmate == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path detection
        if: ${{ always() && needs.changes.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Check formatting with Checkmate
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: |
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]]; then
            DIFF_BASE=HEAD^
          fi
          mapfile -d '' changed_files < <(git diff --name-only --diff-filter=ACMRT -z "$DIFF_BASE" HEAD)
          if ((${#changed_files[@]} == 0)); then
            exit 0
          fi
          markdown_files=()
          formatter_files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              # mdformat rewrites skill frontmatter; Prek excludes these too.
              .agents/*|.codex/*) ;;
              *.md|*.mdx) markdown_files+=("$file") ;;
              *.nix|*.yaml|*.yml) formatter_files+=("$file") ;;
              *) ;;
            esac
          done
          if ((${#markdown_files[@]} > 0)); then
            nix run --no-update-lock-file github:denful/checkmate#fmt --override-input target github:$GITHUB_REPOSITORY/$GITHUB_SHA -- --ci --formatters mdformat --on-unmatched warn "${markdown_files[@]}"
          fi
          if ((${#formatter_files[@]} > 0)); then
            nix run --no-update-lock-file github:denful/checkmate#fmt --override-input target github:$GITHUB_REPOSITORY/$GITHUB_SHA -- --ci --on-unmatched warn "${formatter_files[@]}"
          fi
      - name: Run Checkmate nix-unit tests
        run: nix build --no-update-lock-file -L github:denful/checkmate#checks.x86_64-linux.nix-unit --override-input target github:$GITHUB_REPOSITORY/$GITHUB_SHA
  headless-system:
    name: build headless NixOS
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.nix == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path detection
        if: ${{ always() && needs.changes.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build headless system
        run: nix --accept-flake-config build .#nixosConfigurations.asus-headless.config.system.build.toplevel --print-build-logs
  desktop-system:
    name: build NixOS (shell and compositor)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.nix == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path detection
        if: ${{ always() && needs.changes.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - name: Start freeing runner disk space
        run: |
          status_file="$RUNNER_TEMP/runner-disk-cleanup.status"
          log_file="$RUNNER_TEMP/runner-disk-cleanup.log"
          pid_file="$RUNNER_TEMP/runner-disk-cleanup.pid"
          rm -f "$status_file" "$log_file" "$pid_file"

          (
            trap 'printf "%s\n" "$?" > "$status_file"' EXIT
            set -e
            cleanup_paths=(
              /opt/ghc
              /opt/hostedtoolcache/CodeQL
              /usr/local/lib/android
              /usr/local/lib/node_modules
              /usr/local/share/chromium
              /usr/local/share/powershell
              /usr/share/dotnet
            )
            cleanup_pids=()
            for path in "${cleanup_paths[@]}"; do
              sudo rm -rf -- "$path" &
              cleanup_pids+=("$!")
            done
            cleanup_status=0
            for cleanup_pid in "${cleanup_pids[@]}"; do
              if ! wait "$cleanup_pid"; then
                cleanup_status=1
              fi
            done
            if ((cleanup_status != 0)); then
              exit "$cleanup_status"
            fi
            sudo apt-get clean
            sudo docker system prune --all --force
            df -h
          ) >"$log_file" 2>&1 </dev/null &
          echo "$!" > "$pid_file"
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Evaluate full desktop system
        run: nix --accept-flake-config eval --raw .#nixosConfigurations.asus.config.system.build.toplevel.drvPath
      - name: Wait for runner disk cleanup
        run: |
          status_file="$RUNNER_TEMP/runner-disk-cleanup.status"
          log_file="$RUNNER_TEMP/runner-disk-cleanup.log"
          pid_file="$RUNNER_TEMP/runner-disk-cleanup.pid"
          cleanup_pid="$(<"$pid_file")"

          while [[ ! -f "$status_file" ]]; do
            if ! kill -0 "$cleanup_pid" 2>/dev/null; then
              echo "Runner disk cleanup exited without reporting a status."
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          cleanup_status="$(<"$status_file")"
          if [[ "$cleanup_status" != 0 ]]; then
            cat "$log_file"
            exit "$cleanup_status"
          fi
          df -h
      - name: Build desktop system with primary tools only
        run: nix --accept-flake-config build .#desktop-primary --print-build-logs
  home-manager:
    name: build Home Manager modules (shell, editor, and desktop)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.nix == 'true' || needs.changes.outputs.home == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path detection
        if: ${{ always() && needs.changes.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Evaluate Home Manager and build tooling checks
        run: nix --accept-flake-config build .#checks.x86_64-linux.home-manager-nixos --print-build-logs
  whitespace:
    name: whitespace
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path detection
        if: ${{ always() && needs.changes.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build whitespace check
        run: nix --accept-flake-config build .#checks.x86_64-linux.whitespace --print-build-logs
  niri-config:
    name: niri compositor config
    needs: changes
    if: needs.changes.outputs.niri == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build Niri configuration check
        run: nix --accept-flake-config build .#checks.x86_64-linux.niri-config --print-build-logs
  zellij-config:
    name: zellij shell config
    needs: changes
    if: needs.changes.outputs.zellij == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build Zellij configuration check
        run: nix --accept-flake-config build .#checks.x86_64-linux.zellij-config --print-build-logs
  host-evaluations:
    name: host evaluations
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Build host evaluation check
        run: nix --accept-flake-config build .#checks.x86_64-linux.den-host-evaluation --print-build-logs
