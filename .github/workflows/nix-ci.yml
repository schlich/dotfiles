name: nix-ci
# Build every flake check and verify formatting for topic branches and pull
# requests; main, which `ci land` already cleared, builds only remoteChecks.
# Impact declarations live in the landing machine's ci log, so `ci land`
# classifies the topic there rather than here.
defaults:
  run:
    shell: nu --no-config-file {0}
on:
  pull_request:
  # `ci land --gate github` pushes the topic branch and waits for these
  # checks on its exact head before fast-forwarding main.
  push:
    branches:
      - main
      - "jj-*"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Landings reach main every few minutes and a run with the system closures
  # takes most of an hour, so cancelling left main without a finished run.
  # On main the running build finishes; GitHub keeps only the newest pending
  # push, so the next run covers the latest landing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  checkmate:
    name: Checkmate formatting and unit-test skeleton
    # Only `ci land` pushes main, after Prek and its local clearance passed
    # that exact commit, so a push to main skips the checks again here.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "0.116.0"
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Check formatting with Checkmate
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          let diff_base = if ($env.DIFF_BASE | str trim | is-empty) or ($env.DIFF_BASE =~ '^0+$') {
            "HEAD^"
          } else {
            $env.DIFF_BASE
          fi
          let diff = (^git diff --name-only --diff-filter=ACMRT -z $diff_base HEAD | complete)
          if $diff.exit_code != 0 {
            print --stderr $diff.stderr
            exit $diff.exit_code
          fi
          let changed_files = $diff.stdout | split row (char nul) | where {|file| $file != "" }
          let eligible_files = $changed_files | where {|file|
            not ($file | str starts-with ".agents/")
            and not ($file | str starts-with ".codex/")
            and $file != "pnpm-lock.yaml"
            and not ($file | str ends-with "/pnpm-lock.yaml")
          }
          let markdown_files = $eligible_files | where {|file|
            ($file | str ends-with ".md") or ($file | str ends-with ".mdx")
          }
          let formatter_files = $eligible_files | where {|file|
            ($file | str ends-with ".nix")
            or ($file | str ends-with ".yaml")
            or ($file | str ends-with ".yml")
          }
          if ($markdown_files | is-not-empty) {
            ^nix run
              --no-update-lock-file
              "github:denful/checkmate#fmt"
              --override-input target $"github:($env.GITHUB_REPOSITORY)/($env.GITHUB_SHA)"
              --
              --ci
              --formatters mdformat
              --on-unmatched warn
              ...$markdown_files
          fi
          if ($formatter_files | is-not-empty) {
            ^nix run
              --no-update-lock-file
              "github:denful/checkmate#fmt"
              --override-input target $"github:($env.GITHUB_REPOSITORY)/($env.GITHUB_SHA)"
              --
              --ci
              --on-unmatched warn
              ...$formatter_files
          fi
      - name: Run Checkmate nix-unit tests
        run: ^nix build --no-update-lock-file -L github:denful/checkmate#checks.x86_64-linux.nix-unit --override-input target $"github:($env.GITHUB_REPOSITORY)/($env.GITHUB_SHA)"
  discover:
    # The flake's checks and remoteChecks outputs are the only lists of CI
    # checks: each attribute becomes one job below, locally and in CI alike.
    name: Discover flake checks
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
      remote: ${{ steps.checks.outputs.remote }}
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "0.116.0"
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: List flake checks
        id: checks
        run: |
          let checks = (^nix --accept-flake-config eval --json .#checks.x86_64-linux --apply builtins.attrNames | complete)
          if $checks.exit_code != 0 {
            print --stderr $checks.stderr
            exit $checks.exit_code
          }
          let remote = (^nix --accept-flake-config eval --json .#remoteChecks.x86_64-linux --apply builtins.attrNames | complete)
          if $remote.exit_code != 0 {
            print --stderr $remote.stderr
            exit $remote.exit_code
          }
          let output = [
            $"checks=($checks.stdout | str trim)"
            $"remote=($remote.stdout | str trim)"
          ] | str join "\n"
          $"($output)\n" | save --append $env.GITHUB_OUTPUT
  check:
    name: flake check (${{ matrix.check }})
    needs: discover
    # ci land's local clearance already built these on main's exact commit.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.checks) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/flake-check
        with:
          set: checks
          check: ${{ matrix.check }}
  remote-check:
    # The flake's remoteChecks, the system closures among them, build here
    # after each push without blocking: no required status needs
    # this job, and ci land builds only checks. A failure on main is a
    # regression that landed; the staged switch keeps it off the hosts.
    name: remote check (${{ matrix.check }}, non-blocking)
    needs: discover
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.remote) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/flake-check
        with:
          set: remoteChecks
          check: ${{ matrix.check }}
  checks:
    # The single required status, so adding or renaming a flake check never
    # requires a branch protection change.
    name: nix flake checks
    needs: [discover, check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "0.116.0"
      # A push to main skips the matrix, which ci land cleared before pushing.
      - name: Require every flake check to pass
        env:
          DISCOVER: ${{ needs.discover.result }}
          CHECK: ${{ needs.check.result }}
          LANDED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          print $"discover: ($env.DISCOVER), checks: ($env.CHECK), landed main: ($env.LANDED)"
          if $env.DISCOVER != "success" {
            exit 1
          }
          if $env.CHECK != "success" and not ($env.LANDED == "true" and $env.CHECK == "skipped") {
            exit 1
          }
  failure-review:
    name: CI failure architecture review
    needs: [checkmate, discover, check, checks]
    if: ${{ always() && failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: "0.116.0"
      - name: Add failure review prompts to the run summary
        run: |
          [
            "## CI failure: turn this into a lasting guarantee"
            ""
            "Before treating the failure as fixed, record the root cause and consider which guarantee would prevent this class of bug or improve the architecture:"
            ""
            "- **TLA+ model:** Does this expose a missing state, transition, invariant, or liveness property? Extend and check the model when the behavior is stateful or protocol-like."
            "- **Property-based test:** Can generated inputs, operation sequences, or failure schedules cover the boundary that failed? Add a property and retain a minimal regression example."
            "- **Rust concurrency guarantee:** If this is a concurrent Rust component, can ownership, synchronization, atomics, or a concurrency test make the invariant explicit and enforceable?"
            "- **TigerBeetle transaction guarantee:** If this involves TigerBeetle or ledger-style state, should transaction boundaries, atomicity, idempotency, or transfer invariants be modeled and tested?"
            "- **Architecture:** What design change would make the invalid state harder to represent or the guarantee easier to verify? Record why the chosen mechanism fits."
            ""
            "These are options to assess, not mandatory technologies. Choose the smallest applicable durable guarantee; explain when none adds value. See [CI failure review guide](../blob/main/docs/ci-failure-review.md)."
            ""
          ] | str join "\n" | save --append $env.GITHUB_STEP_SUMMARY
