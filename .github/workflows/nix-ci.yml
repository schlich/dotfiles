name: nix-ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    # Every commit carries an Impact trailer; a refactor must leave every
    # NixOS closure identical to the merge base. Queue and main runs were
    # already classified on their pull request.
    name: impact classification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Classify and verify the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: nix run --inputs-from . nixpkgs#nushell -- jj/ci.nu impact check "$BASE" "$HEAD"
  checkmate:
    name: Checkmate formatting and unit-test skeleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Check formatting with Checkmate
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: |
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]]; then
            DIFF_BASE=HEAD^
          fi
          mapfile -d '' changed_files < <(git diff --name-only --diff-filter=ACMRT -z "$DIFF_BASE" HEAD)
          if ((${#changed_files[@]} == 0)); then
            exit 0
          fi
          markdown_files=()
          formatter_files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              # mdformat rewrites skill frontmatter; Prek excludes these too.
              .agents/*|.codex/*) ;;
              # pnpm generates this YAML lockfile; generic formatting reports
              # a rewrite even when its formatted bytes are unchanged.
              */pnpm-lock.yaml|pnpm-lock.yaml) ;;
              *.md|*.mdx) markdown_files+=("$file") ;;
              *.nix|*.yaml|*.yml) formatter_files+=("$file") ;;
              *) ;;
            esac
          done
          if ((${#markdown_files[@]} > 0)); then
            nix run --no-update-lock-file github:denful/checkmate#fmt --override-input target github:$GITHUB_REPOSITORY/$GITHUB_SHA -- --ci --formatters mdformat --on-unmatched warn "${markdown_files[@]}"
          fi
          if ((${#formatter_files[@]} > 0)); then
            nix run --no-update-lock-file github:denful/checkmate#fmt --override-input target github:$GITHUB_REPOSITORY/$GITHUB_SHA -- --ci --on-unmatched warn "${formatter_files[@]}"
          fi
      - name: Run Checkmate nix-unit tests
        run: nix build --no-update-lock-file -L github:denful/checkmate#checks.x86_64-linux.nix-unit --override-input target github:$GITHUB_REPOSITORY/$GITHUB_SHA
  discover:
    # The flake's checks output is the only list of CI checks: each attribute
    # becomes one job below, locally and in CI alike.
    name: Discover flake checks
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: List flake checks
        id: checks
        run: echo "checks=$(nix --accept-flake-config eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"
  check:
    name: flake check (${{ matrix.check }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.checks) }}
    steps:
      - uses: actions/checkout@v6
      # Only the desktop closure outgrows the runner's free disk.
      - name: Start freeing runner disk space
        if: matrix.check == 'desktop-primary'
        run: |
          status_file="$RUNNER_TEMP/runner-disk-cleanup.status"
          log_file="$RUNNER_TEMP/runner-disk-cleanup.log"
          pid_file="$RUNNER_TEMP/runner-disk-cleanup.pid"
          rm -f "$status_file" "$log_file" "$pid_file"

          (
            trap 'printf "%s\n" "$?" > "$status_file"' EXIT
            set -e
            cleanup_paths=(
              /opt/ghc
              /opt/hostedtoolcache/CodeQL
              /usr/local/lib/android
              /usr/local/lib/node_modules
              /usr/local/share/chromium
              /usr/local/share/powershell
              /usr/share/dotnet
            )
            cleanup_pids=()
            for path in "${cleanup_paths[@]}"; do
              sudo rm -rf -- "$path" &
              cleanup_pids+=("$!")
            done
            cleanup_status=0
            for cleanup_pid in "${cleanup_pids[@]}"; do
              if ! wait "$cleanup_pid"; then
                cleanup_status=1
              fi
            done
            if ((cleanup_status != 0)); then
              exit "$cleanup_status"
            fi
            sudo apt-get clean
            sudo docker system prune --all --force
            df -h
          ) >"$log_file" 2>&1 </dev/null &
          echo "$!" > "$pid_file"
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      # Evaluation fetches sources outside flake.lock, such as Helix's
      # tree-sitter grammars, which no binary cache holds. Reuse Nix's fetcher
      # cache instead of downloading them again in every job.
      - name: Restore the Nix fetcher cache
        id: fetcher-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/nix
          key: nix-fetcher-${{ hashFiles('flake.lock') }}
          restore-keys: nix-fetcher-
      # nix-fast-build evaluates and queries the binary cache through `nix`
      # before building, so only `nix build` waits for the cleanup; the
      # evaluation runs meanwhile. Its stdout is the job log.
      - name: Hold builds until runner disk cleanup finishes
        if: matrix.check == 'desktop-primary'
        run: |
          wrapper="$RUNNER_TEMP/nix-after-disk-cleanup"
          cat > "$wrapper" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case " $* " in
            *" build "*)
              status_file="$RUNNER_TEMP/runner-disk-cleanup.status"
              log_file="$RUNNER_TEMP/runner-disk-cleanup.log"
              pid_file="$RUNNER_TEMP/runner-disk-cleanup.pid"
              cleanup_pid="$(<"$pid_file")"

              while [[ ! -f "$status_file" ]]; do
                if ! kill -0 "$cleanup_pid" 2>/dev/null; then
                  echo "Runner disk cleanup exited without reporting a status."
                  cat "$log_file"
                  exit 1
                fi
                sleep 1
              done

              cleanup_status="$(<"$status_file")"
              if [[ "$cleanup_status" != 0 ]]; then
                cat "$log_file"
                exit "$cleanup_status"
              fi
              df -h
              ;;
          esac
          exec nix "$@"
          EOF
          chmod +x "$wrapper"
          echo "NIX_FAST_BUILD_NIX=$wrapper" >> "$GITHUB_ENV"
      # --skip-cached replaces path filtering: an unchanged check is already
      # in the binary cache, so it passes without being downloaded or rebuilt.
      - name: Build ${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
        run: >-
          nix --accept-flake-config run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached --flake .#checks.x86_64-linux --select "checks: { inherit (checks) $CHECK; }"
      # This check evaluates the full workstation and the other hosts, so its
      # fetcher cache serves the rest; anything missing is fetched as before.
      - name: Save the Nix fetcher cache
        if: matrix.check == 'den-host-evaluation' && steps.fetcher-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/nix
          key: ${{ steps.fetcher-cache.outputs.cache-primary-key }}
  checks:
    # The single required status, so adding or renaming a flake check never
    # requires a branch protection change.
    name: nix flake checks
    needs: [discover, check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every flake check to pass
        env:
          DISCOVER: ${{ needs.discover.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "discover: $DISCOVER, checks: $CHECK"
          [[ "$DISCOVER" == success && "$CHECK" == success ]]
  failure-review:
    name: CI failure architecture review
    needs: [impact, checkmate, discover, check, checks]
    if: ${{ always() && failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Add failure review prompts to the run summary
        run: |
          {
            echo '## CI failure: turn this into a lasting guarantee'
            echo
            echo 'Before treating the failure as fixed, record the root cause and consider which guarantee would prevent this class of bug or improve the architecture:'
            echo
            echo '- **TLA+ model:** Does this expose a missing state, transition, invariant, or liveness property? Extend and check the model when the behavior is stateful or protocol-like.'
            echo '- **Property-based test:** Can generated inputs, operation sequences, or failure schedules cover the boundary that failed? Add a property and retain a minimal regression example.'
            echo '- **Rust concurrency guarantee:** If this is a concurrent Rust component, can ownership, synchronization, atomics, or a concurrency test make the invariant explicit and enforceable?'
            echo '- **TigerBeetle transaction guarantee:** If this involves TigerBeetle or ledger-style state, should transaction boundaries, atomicity, idempotency, or transfer invariants be modeled and tested?'
            echo '- **Architecture:** What design change would make the invalid state harder to represent or the guarantee easier to verify? Record why the chosen mechanism fits.'
            echo
            echo 'These are options to assess, not mandatory technologies. Choose the smallest applicable durable guarantee; explain when none adds value. See [CI failure review guide](../blob/main/docs/ci-failure-review.md).'
          } >> "$GITHUB_STEP_SUMMARY"
