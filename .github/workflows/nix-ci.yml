name: nix-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: accept-flake-config = true

jobs:
  fmt:
    name: nix fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.1
        with:
          kvm: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check formatting
        run: |
          nix fmt
          git diff --exit-code

  home-manager:
    name: home-manager (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - schlich
          - nixos
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.1
        with:
          kvm: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build Home Manager profile
        run: nix build .#homeConfigurations.${{ matrix.profile }}.activationPackage

  nixos:
    name: nixos (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - nixos
          - desktop
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.1
        with:
          kvm: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build NixOS host
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  smoke-test:
    name: system smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.1
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run smoke test
        run: nix build -f system/system_test.nix
