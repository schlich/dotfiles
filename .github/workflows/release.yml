name: release
# Cut a CalVer release (YYYY.MM.DD.N) for every behavior or breaking commit
# that reaches main. Each run releases all such commits since the newest
# release, so a cancelled or skipped run is covered by the next one.
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: CalVer release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
      - name: Release user-facing changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run --inputs-from . nixpkgs#nushell -- jj/ci.nu release
