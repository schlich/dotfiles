name: Build one flake check
description: >-
  Build one attribute of the flake's checks or remoteChecks with nix-fast-build, freeing runner disk first for the desktop closure.
inputs:
  set:
    description: The flake output that holds the check, checks or remoteChecks.
    required: true
  check:
    description: The check's attribute name.
    required: true
runs:
  using: composite
  steps:
    # Only the desktop closure outgrows the runner's free disk.
    - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
      with:
        version: "0.116.0"
    - name: Start freeing runner disk space
      if: inputs.check == 'desktop-primary'
      shell: nu --no-config-file {0}
      run: |
        let status_file = $"($env.RUNNER_TEMP)/runner-disk-cleanup.status"
        let log_file = $"($env.RUNNER_TEMP)/runner-disk-cleanup.log"
        rm --force $status_file $log_file
        "" | save --force $log_file
        job spawn --description runner-disk-cleanup {
          let cleanup_status = try {
            let cleanup_paths = [
              /opt/ghc
              /opt/hostedtoolcache/CodeQL
              /usr/local/lib/android
              /usr/local/lib/node_modules
              /usr/local/share/chromium
              /usr/local/share/powershell
              /usr/share/dotnet
            ]
            let removals = $cleanup_paths | par-each {|path| ^sudo rm -rf -- $path | complete }
            let removal_output = $removals
              | each {|result| [$result.stdout $result.stderr] | where {|text| $text != "" } | str join "\n" }
              | where {|text| $text != "" }
              | str join "\n"
            if ($removal_output | is-not-empty) {
              $"($removal_output)\n" | save --append $log_file
            }
            if ($removals | any {|result| $result.exit_code != 0 }) {
              error make {msg: "Runner disk cleanup could not remove all paths."}
            }
            let apt = (^sudo apt-get clean | complete)
            if ($apt.stdout | is-not-empty) { $"($apt.stdout)\n" | save --append $log_file }
            if ($apt.stderr | is-not-empty) { $"($apt.stderr)\n" | save --append $log_file }
            if $apt.exit_code != 0 {
              error make {msg: "Runner disk cleanup failed at apt-get clean."}
            }
            let docker = (^sudo docker system prune --all --force | complete)
            if ($docker.stdout | is-not-empty) { $"($docker.stdout)\n" | save --append $log_file }
            if ($docker.stderr | is-not-empty) { $"($docker.stderr)\n" | save --append $log_file }
            if $docker.exit_code != 0 {
              error make {msg: "Runner disk cleanup failed at docker system prune."}
            }
            let disk = (^df -h | complete)
            if ($disk.stdout | is-not-empty) { $"($disk.stdout)\n" | save --append $log_file }
            if ($disk.stderr | is-not-empty) { $"($disk.stderr)\n" | save --append $log_file }
            if $disk.exit_code != 0 {
              error make {msg: "Could not report runner disk usage."}
            }
            0
          } catch {|err|
            $"($err.msg)\n" | save --append $log_file
            1
          }
          $"($cleanup_status)" | save --force $status_file
        } | ignore
    # The installer also enables KVM, which the NixOS VM tests need.
    - uses: DeterminateSystems/determinate-nix-action@v3.21.9
    - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
    # Evaluation fetches sources outside flake.lock, such as Helix's
    # tree-sitter grammars, which no binary cache holds. Reuse Nix's fetcher
    # cache instead of downloading them again in every job.
    - name: Restore the Nix fetcher cache
      id: fetcher-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/nix
        key: nix-fetcher-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetcher-
    # nix-fast-build evaluates and queries the binary cache through `nix`
    # before building, so only `nix build` waits for the cleanup; the
    # evaluation runs meanwhile. Its stdout is the job log.
    - name: Hold builds until runner disk cleanup finishes
      if: inputs.check == 'desktop-primary'
      shell: nu --no-config-file {0}
      run: |
        let wrapper = $"($env.RUNNER_TEMP)/nix-after-disk-cleanup"
        let wrapper_source = r#'#!/usr/bin/env -S nu --no-config-file
        let args = $env.CMDLINE_ARGS
        if "build" in $args {
          let status_file = $"($env.RUNNER_TEMP)/runner-disk-cleanup.status"
          let log_file = $"($env.RUNNER_TEMP)/runner-disk-cleanup.log"
          mut waited = 0
          while not ($status_file | path exists) {
            if $waited >= 3600 {
              print --stderr "Timed out waiting for runner disk cleanup."
              exit 1
            }
            sleep 1sec
            $waited += 1
          }
          let cleanup_status = (open $status_file | str trim | into int)
          if $cleanup_status != 0 {
            print --stderr (open --raw $log_file)
            exit $cleanup_status
          }
          ^df -h
        }
        ^nix ...$args
        '# 
        $wrapper_source | save --force $wrapper
        ^chmod +x $wrapper
        $"NIX_FAST_BUILD_NIX=($wrapper)\n" | save --append $env.GITHUB_ENV
    # --skip-cached replaces path filtering: an unchanged check is already
    # in the binary cache, so it passes without being downloaded or rebuilt.
    - name: Build ${{ inputs.check }}
      env:
        SET: ${{ inputs.set }}
        CHECK: ${{ inputs.check }}
      shell: nu --no-config-file {0}
      run: |
        ^nix --accept-flake-config run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached --flake $".#($env.SET).x86_64-linux" --select $"checks: { inherit (checks) ($env.CHECK); }"
    # This check evaluates the full workstation, the largest host, so its
    # fetcher cache serves the rest; anything missing is fetched as before.
    - name: Save the Nix fetcher cache
      if: inputs.check == 'clan-machine-asus' && steps.fetcher-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/nix
        key: ${{ steps.fetcher-cache.outputs.cache-primary-key }}
