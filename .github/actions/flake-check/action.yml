name: Build one flake check
description: >-
  Build one attribute of the flake's checks or remoteChecks with nix-fast-build, freeing runner disk first for the desktop closures.
inputs:
  set:
    description: The flake output that holds the check, checks or remoteChecks.
    required: true
  check:
    description: The check's attribute name.
    required: true
runs:
  using: composite
  steps:
    # Only the desktop closures, its home and its system, outgrow the
    # runner's free disk.
    - name: Start freeing runner disk space
      if: inputs.check == 'desktop-primary' || inputs.check == 'desktop-system'
      shell: bash
      run: |
        status_file="$RUNNER_TEMP/runner-disk-cleanup.status"
        log_file="$RUNNER_TEMP/runner-disk-cleanup.log"
        pid_file="$RUNNER_TEMP/runner-disk-cleanup.pid"
        rm -f "$status_file" "$log_file" "$pid_file"

        (
          trap 'printf "%s\n" "$?" > "$status_file"' EXIT
          set -e
          cleanup_paths=(
            /opt/ghc
            /opt/hostedtoolcache/CodeQL
            /usr/local/lib/android
            /usr/local/lib/node_modules
            /usr/local/share/chromium
            /usr/local/share/powershell
            /usr/share/dotnet
          )
          cleanup_pids=()
          for path in "${cleanup_paths[@]}"; do
            sudo rm -rf -- "$path" &
            cleanup_pids+=("$!")
          done
          cleanup_status=0
          for cleanup_pid in "${cleanup_pids[@]}"; do
            if ! wait "$cleanup_pid"; then
              cleanup_status=1
            fi
          done
          if ((cleanup_status != 0)); then
            exit "$cleanup_status"
          fi
          sudo apt-get clean
          sudo docker system prune --all --force
          df -h
        ) >"$log_file" 2>&1 </dev/null &
        echo "$!" > "$pid_file"
    # The installer also enables KVM, which the NixOS VM tests need.
    - uses: DeterminateSystems/determinate-nix-action@v3.21.9
    - uses: DeterminateSystems/flakehub-cache-action@v3.21.9
    # Evaluation fetches sources outside flake.lock, such as Helix's
    # tree-sitter grammars, which no binary cache holds. Reuse Nix's fetcher
    # cache instead of downloading them again in every job.
    - name: Restore the Nix fetcher cache
      id: fetcher-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/nix
        key: nix-fetcher-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetcher-
    # nix-fast-build evaluates and queries the binary cache through `nix`
    # before building, so only `nix build` waits for the cleanup; the
    # evaluation runs meanwhile. Its stdout is the job log.
    - name: Hold builds until runner disk cleanup finishes
      if: inputs.check == 'desktop-primary' || inputs.check == 'desktop-system'
      shell: bash
      run: |
        wrapper="$RUNNER_TEMP/nix-after-disk-cleanup"
        cat > "$wrapper" <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        case " $* " in
          *" build "*)
            status_file="$RUNNER_TEMP/runner-disk-cleanup.status"
            log_file="$RUNNER_TEMP/runner-disk-cleanup.log"
            pid_file="$RUNNER_TEMP/runner-disk-cleanup.pid"
            cleanup_pid="$(<"$pid_file")"

            while [[ ! -f "$status_file" ]]; do
              if ! kill -0 "$cleanup_pid" 2>/dev/null; then
                echo "Runner disk cleanup exited without reporting a status."
                cat "$log_file"
                exit 1
              fi
              sleep 1
            done

            cleanup_status="$(<"$status_file")"
            if [[ "$cleanup_status" != 0 ]]; then
              cat "$log_file"
              exit "$cleanup_status"
            fi
            df -h
            ;;
        esac
        exec nix "$@"
        EOF
        chmod +x "$wrapper"
        echo "NIX_FAST_BUILD_NIX=$wrapper" >> "$GITHUB_ENV"
    # Every nix process from here on appends its log events, as JSON
    # without timestamps, to json-log-path; tools/ci-trace/collect.py
    # follows that file and stamps each activity start, stop, and build
    # phase as it lands. It follows a plain file, so a collector that dies
    # never blocks a build.
    - name: Start the Nix build trace
      shell: bash
      run: |
        dir="$RUNNER_TEMP/nix-trace"
        mkdir -p "$dir/out"
        nohup python3 "$GITHUB_WORKSPACE/tools/ci-trace/collect.py" "$dir/nix-log.jsonl" "$dir/out/events.tsv" >"$dir/collect.log" 2>&1 &
        echo "$!" > "$dir/collect.pid"
        {
          echo 'NIX_CONFIG<<NIX_CONFIG_EOF'
          if [[ -n "${NIX_CONFIG:-}" ]]; then
            printf '%s\n' "$NIX_CONFIG"
          fi
          echo "json-log-path = $dir/nix-log.jsonl"
          echo 'NIX_CONFIG_EOF'
        } >> "$GITHUB_ENV"
    # --skip-cached replaces path filtering: an unchanged check is already
    # in the binary cache, so it passes without being downloaded or rebuilt.
    - name: Build ${{ inputs.check }}
      shell: bash
      env:
        SET: ${{ inputs.set }}
        CHECK: ${{ inputs.check }}
      run: >-
        nix --accept-flake-config run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached --flake ".#$SET.x86_64-linux" --select "checks: { inherit (checks) $CHECK; }"
    # This check evaluates the full workstation, the largest host, so its
    # fetcher cache serves the rest; anything missing is fetched as before.
    - name: Save the Nix fetcher cache
      if: inputs.check == 'clan-machine-asus' && steps.fetcher-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/nix
        key: ${{ steps.fetcher-cache.outputs.cache-primary-key }}
    # The trace never fails the check: a failed or cancelled build is when
    # it matters most, and a broken trace must not hide the build's result.
    - name: Summarize the Nix build trace
      if: always()
      continue-on-error: true
      shell: bash
      env:
        TITLE: ${{ inputs.set }}.${{ inputs.check }}
      run: |
        dir="$RUNNER_TEMP/nix-trace"
        [[ -f "$dir/collect.pid" ]] || exit 0
        pid="$(<"$dir/collect.pid")"
        kill -TERM "$pid" 2>/dev/null || true
        for _ in $(seq 50); do
          kill -0 "$pid" 2>/dev/null || break
          sleep 0.1
        done
        cat "$dir/collect.log"
        nix --accept-flake-config run --inputs-from . nixpkgs#nushell -- --no-config-file tools/ci-trace/ci-trace.nu convert "$dir/out/events.tsv" "$dir/out" --title "$TITLE" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the Nix build trace
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: nix-trace-${{ inputs.set }}-${{ inputs.check }}
        path: ${{ runner.temp }}/nix-trace/out
        if-no-files-found: ignore
        retention-days: 30
