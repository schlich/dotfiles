\* Activation has no timeout, so the dead-man timer may fire while the run
\* that armed it is still activating or watching.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Initial = s0
    Revs = {r1, r2}
    MaxStages = 3
    AutoDeploy = TRUE
    SlowActivation = TRUE

INVARIANTS
    TypeOK
    BootDefaultPassedItsWatch
    CommitIsNeverReverted
    OneRevertPerStage
    SettledRunsBootDefault
    SettledHasNoPending
    AutoStagesEachRevisionOnce
    SettleNeverRacesARun

PROPERTIES
    RevertRestoresBootDefault
