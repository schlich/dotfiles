\* The dead-man timer fires only once the run that armed it has died, as
\* the design intends: races left here need no slow activation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Initial = s0
    Revs = {r1, r2}
    MaxStages = 3
    AutoDeploy = TRUE
    SlowActivation = FALSE

INVARIANTS
    TypeOK
    BootDefaultPassedItsWatch
    CommitIsNeverReverted
    OneRevertPerStage
    SettledRunsBootDefault
    SettledHasNoPending
    AutoStagesEachRevisionOnce
    SettleNeverRacesARun

PROPERTIES
    RevertRestoresBootDefault
