version = 4
# IWE workspace for the executable-knowledge proof of concept, in the IWE 0.25+
# format; an older config (`version = 3`, `[library]`) is rewritten in place on
# first read, which the round-trip test would report as a change.
[markdown]
refs_extension = ".md"

[workspace]
path = "knowledge"
frontmatter_document_title = "title"

[completion]
link_format = "markdown"

# Schemas bind by key glob, not by the frontmatter `type` field; the schemas
# themselves pin `type` so the two cannot drift apart.
[schemas.concept]
match = "concepts/**"

[schemas.investigation]
match = "investigations/**"

[schemas.project]
match = "projects/**"

[actions]

[actions.extract]
type = "extract"
title = "Extract"
link_type = "markdown"
key_template = "{{id}}"

[actions.extract_all]
type = "extract_all"
title = "Extract all subsections"
link_type = "markdown"
key_template = "{{id}}"

[actions.inline_section]
type = "inline"
title = "Inline section"
inline_type = "section"
keep_target = false

[actions.inline_quote]
type = "inline"
title = "Inline quote"
inline_type = "quote"
keep_target = false

[actions.link]
type = "link"
title = "Link word"
link_type = "markdown"
key_template = "{{id}}"
