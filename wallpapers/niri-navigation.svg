<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1019"/>
      <stop offset="52%" stop-color="#101d2b"/>
      <stop offset="100%" stop-color="#071017"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="8%" r="76%">
      <stop offset="0%" stop-color="#236089" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#103047" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#071017" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .eyebrow { font: 600 23px sans-serif; letter-spacing: 7px; fill: #72c7ff; }
      .title { font: 700 88px sans-serif; letter-spacing: -3px; fill: #edf7ff; }
      .subtitle { font: 400 30px sans-serif; fill: #9db3c3; }
      .section { font: 600 22px sans-serif; letter-spacing: 3px; fill: #72c7ff; }
      .key { font: 600 27px monospace; fill: #e7f5ff; }
      .action { font: 400 27px sans-serif; fill: #b7c9d6; }
      .note { font: 400 23px sans-serif; fill: #758b9c; }
    </style>
  </defs>

  <rect width="2560" height="1440" fill="url(#background)"/>
  <rect width="2560" height="1440" fill="url(#glow)"/>
  <path d="M0 1180C430 1050 615 1330 1080 1205S1775 1015 2560 1220V1440H0Z" fill="#0c1a26" opacity="0.8"/>
  <path d="M0 1220C430 1090 665 1365 1090 1240S1790 1050 2560 1250" fill="none" stroke="#3788b6" stroke-opacity="0.24" stroke-width="2"/>

  <g transform="translate(214 178)">
    <text class="eyebrow" x="0" y="0">NIRI FIELD GUIDE</text>
    <text class="title" x="0" y="105">NAVIGATE THE FLOW</text>
    <text class="subtitle" x="2" y="161">Mod is Super. Shift moves. Ctrl crosses boundaries.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="180" y="448" width="690" height="660" rx="28" fill="#112638" fill-opacity="0.88" stroke="#3d7fa5" stroke-opacity="0.42"/>
    <rect x="935" y="448" width="690" height="660" rx="28" fill="#112638" fill-opacity="0.88" stroke="#3d7fa5" stroke-opacity="0.42"/>
    <rect x="1690" y="448" width="690" height="660" rx="28" fill="#112638" fill-opacity="0.88" stroke="#3d7fa5" stroke-opacity="0.42"/>
  </g>

  <g transform="translate(230 514)">
    <text class="section" x="0" y="0">FOCUS</text>
    <text class="key" x="0" y="78">MOD + H J K L</text><text class="action" x="300" y="78">left / down / up / right</text>
    <text class="key" x="0" y="142">MOD + ARROWS</text><text class="action" x="260" y="142">same directions</text>
    <text class="key" x="0" y="206">MOD + HOME / END</text><text class="action" x="310" y="206">first / last column</text>
    <line x1="0" y1="255" x2="590" y2="255" stroke="#5d91ad" stroke-opacity="0.35"/>
    <text class="section" x="0" y="312">WORKSPACES</text>
    <text class="key" x="0" y="390">MOD + U / I</text><text class="action" x="270" y="390">previous / next</text>
    <text class="key" x="0" y="454">MOD + PAGE UP / DOWN</text><text class="action" x="490" y="454">previous / next</text>
    <text class="key" x="0" y="518">MOD + TAB</text><text class="action" x="240" y="518">previous workspace</text>
  </g>

  <g transform="translate(985 514)">
    <text class="section" x="0" y="0">MOVE WINDOWS</text>
    <text class="key" x="0" y="78">MOD + SHIFT + H J K L</text><text class="action" x="390" y="78">move in direction</text>
    <text class="key" x="0" y="142">MOD + SHIFT + ARROWS</text><text class="action" x="390" y="142">same directions</text>
    <text class="key" x="0" y="206">MOD + CTRL + U / I</text><text class="action" x="330" y="206">to previous / next workspace</text>
    <line x1="0" y1="255" x2="590" y2="255" stroke="#5d91ad" stroke-opacity="0.35"/>
    <text class="section" x="0" y="312">MONITORS</text>
    <text class="key" x="0" y="390">MOD + CTRL + H J K L</text><text class="action" x="390" y="390">focus monitor</text>
    <text class="key" x="0" y="454">MOD + SHIFT + CTRL + H J K L</text><text class="action" x="430" y="454">move column</text>
  </g>

  <g transform="translate(1740 514)">
    <text class="section" x="0" y="0">WORKSPACE TARGETS</text>
    <text class="key" x="0" y="78">MOD + 1 ... 9</text><text class="action" x="260" y="78">focus workspace</text>
    <text class="key" x="0" y="142">MOD + SHIFT + 1 ... 9</text><text class="action" x="360" y="142">move column there</text>
    <text class="key" x="0" y="206">MOD + 0</text><text class="action" x="185" y="206">focus config</text>
    <line x1="0" y1="255" x2="590" y2="255" stroke="#5d91ad" stroke-opacity="0.35"/>
    <text class="section" x="0" y="312">COLUMN CONTROL</text>
    <text class="key" x="0" y="390">MOD + R</text><text class="action" x="185" y="390">cycle column width</text>
    <text class="key" x="0" y="454">MOD + F</text><text class="action" x="185" y="454">maximize column</text>
    <text class="key" x="0" y="518">MOD + C</text><text class="action" x="185" y="518">center column</text>
  </g>

  <g transform="translate(214 1290)">
    <rect x="0" y="-34" width="2132" height="2" fill="#72c7ff" fill-opacity="0.38"/>
    <text class="note" x="0" y="18">More: MOD + SHIFT + / shows Niri's complete hotkey overlay</text>
    <text class="note" x="1784" y="18">niri / navigation</text>
  </g>
</svg>
