name: Build headless NixOS

when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - nix
  - git
  - cacert

cache:
  - key: nix-store
    hash:
      - flake.lock
    paths:
      - /nix/store
      - /nix/var/nix/db

steps:
  - name: "Build headless system"
    command: "nix --accept-flake-config build .#nixosConfigurations.asus-headless.config.system.build.toplevel --print-build-logs"
