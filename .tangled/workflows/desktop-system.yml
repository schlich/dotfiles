name: Build desktop NixOS
when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]
engine: microvm
image: nixos
dependencies:
  - nix
  - git
  - cacert
# Reuse realized FlakeHub inputs and build products across workflow runs.
# The lockfile hash rotates the cache when dependency revisions change.
cache:
  - key: nix-store
    hash:
      - flake.lock
    paths:
      - /nix/store
      - /nix/var/nix/db
steps:
  - name: "Build desktop system"
    command: "nix --accept-flake-config build .#nixosConfigurations.asus.config.system.build.toplevel --print-build-logs"
