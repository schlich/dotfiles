name: Check Zellij configuration
when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]
engine: microvm
image: nixos
dependencies:
  - nix
  - git
  - cacert
cache:
  - key: nix-store
    hash:
      - flake.lock
    paths:
      - /nix/store
      - /nix/var/nix/db
steps:
  - name: "Check Zellij shell config"
    command: "nix --accept-flake-config build .#checks.x86_64-linux.zellij-config --print-build-logs"
