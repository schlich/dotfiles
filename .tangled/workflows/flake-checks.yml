name: Nix flake checks
# Runs only when started by hand. `ci land` gates on the same command built
# locally by default; on every push, the homelab spindle's serial queue filled
# with 30-minute cold-store timeouts and never passed a run. Start it manually
# on a `jj-*` branch before `ci land --gate spindle`.
when:
  - event: ["manual"]
    branch: ["main", "jj-*"]
engine: microvm
image: nixos
dependencies:
  - nix
  - git
  - cacert
# Reuse realized FlakeHub inputs and build products across workflow runs.
# The lockfile hash rotates the cache when dependency revisions change.
cache:
  - key: nix-store
    hash:
      - flake.lock
    paths:
      - /nix/store
      - /nix/var/nix/db
steps:
  # The same checks.x86_64-linux set that GitHub Actions runs as a matrix.
  # nix-fast-build starts one evaluator per CPU by default, and each system
  # evaluation grows to about 4 GiB, which exhausts the guest's memory. Two
  # evaluators that restart at 3 GiB keep evaluation well inside it.
  - name: "Build flake checks"
    command: "nix --accept-flake-config run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached --eval-workers 2 --eval-max-memory-size 3072 --flake .#checks.x86_64-linux"
