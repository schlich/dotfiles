name: Nix flake checks
when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]
engine: microvm
image: nixos
dependencies:
  - nix
  - git
  - cacert
# Reuse realized FlakeHub inputs and build products across workflow runs.
# The lockfile hash rotates the cache when dependency revisions change.
cache:
  - key: nix-store
    hash:
      - flake.lock
    paths:
      - /nix/store
      - /nix/var/nix/db
steps:
  # The same checks.x86_64-linux set that GitHub Actions runs as a matrix.
  - name: "Build flake checks"
    command: "nix --accept-flake-config run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached --flake .#checks.x86_64-linux"
