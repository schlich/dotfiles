repos:
  - repo: local
    hooks:
      - id: nix-fmt
        name: nix fmt
        entry: nix fmt --
        language: system
        files: '\.nix$'
        pass_filenames: false
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check
        language: system
        files: '(^|/)(flake\.nix|flake\.lock)$'
        pass_filenames: false
