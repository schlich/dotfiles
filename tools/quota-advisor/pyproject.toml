[project]
name = "quota-advisor"
version = "0.1.0"
description = "Explainable subscription usage pacing advisor"
requires-python = ">=3.11"

[project.scripts]
quota-advisor = "quota_advisor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
