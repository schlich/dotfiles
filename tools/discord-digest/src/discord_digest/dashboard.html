<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord Digest</title>
    <style>
      :root {
        --bg: #f6f5f1;
        --panel: #ffffff;
        --ink: #1c1b19;
        --muted: #6b6860;
        --line: #e2dfd6;
        --accent: #4f46e5;
        --accent-ink: #ffffff;
        --sel: #eef0ff;
        --release: #0f766e;
        --stack: #4f46e5;
        --discussion: #b45309;
        --hot: #dc2626;
        --bar: #1c1b19;
        --bar-ink: #f6f5f1;
        --key: #3a3934;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #131312;
          --panel: #1c1c1a;
          --ink: #ecebe6;
          --muted: #9a978d;
          --line: #2e2d2a;
          --accent: #8b87ff;
          --accent-ink: #131312;
          --sel: #23233a;
          --release: #2dd4bf;
          --stack: #a5a2ff;
          --discussion: #fbbf24;
          --hot: #f87171;
          --bar: #0b0b0a;
          --bar-ink: #ecebe6;
          --key: #34332f;
        }
      }
      :root[data-theme="dark"] {
        --bg: #131312;
        --panel: #1c1c1a;
        --ink: #ecebe6;
        --muted: #9a978d;
        --line: #2e2d2a;
        --accent: #8b87ff;
        --accent-ink: #131312;
        --sel: #23233a;
        --release: #2dd4bf;
        --stack: #a5a2ff;
        --discussion: #fbbf24;
        --hot: #f87171;
        --bar: #0b0b0a;
        --bar-ink: #ecebe6;
        --key: #34332f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding-bottom: 76px;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      header h1 {
        font-size: 20px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      header .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0;
        align-items: center;
      }
      .chip,
      select,
      input[type="search"] {
        font: inherit;
        font-size: 13px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 999px;
        padding: 4px 12px;
      }
      .chip {
        cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      input[type="search"] {
        flex: 1 1 200px;
        min-width: 0;
        border-radius: 8px;
      }
      .overview {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 18px;
      }
      .overview h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 6px;
      }
      .overview ul {
        margin: 0;
        padding-left: 18px;
      }
      .overview li {
        margin: 4px 0;
      }
      code {
        font:
          13px ui-monospace,
          "JetBrains Mono",
          monospace;
      }
      .empty {
        color: var(--muted);
        padding: 32px 0;
        text-align: center;
      }
      .finding {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--cat);
        border-radius: 10px;
        padding: 12px 16px;
        margin: 10px 0;
        cursor: pointer;
      }
      .finding.selected {
        outline: 2px solid var(--accent);
        background: var(--sel);
      }
      .finding.seen {
        opacity: 0.5;
      }
      .finding .meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .finding .score {
        font-weight: 700;
        color: var(--ink);
      }
      .finding .score.hot {
        color: var(--hot);
      }
      .finding .cat {
        color: var(--cat);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .finding h3 {
        font-size: 16px;
        margin: 4px 0;
      }
      .finding p {
        margin: 4px 0;
      }
      .finding .why {
        font-size: 13px;
        color: var(--muted);
        font-style: italic;
      }
      .finding a {
        color: var(--accent);
        font-size: 13px;
      }
      .cat-release {
        --cat: var(--release);
      }
      .cat-stack {
        --cat: var(--stack);
      }
      .cat-discussion {
        --cat: var(--discussion);
      }

      /* Persistent hint bar: the keys that work in the current mode. */
      .hintbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bar);
        color: var(--bar-ink);
        font:
          12px/1.4 ui-monospace,
          "JetBrains Mono",
          monospace;
        padding: 8px 12px;
        display: flex;
        gap: 6px 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      .mode {
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
      }
      .hint kbd {
        background: var(--key);
        border-radius: 3px;
        padding: 0 5px;
        margin-right: 4px;
        font: inherit;
      }
      @media (max-width: 600px) {
        .hintbar .hint.opt {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Discord Digest</h1>
        <div class="sub" id="sub"></div>
      </header>
      <div class="controls">
        <button class="chip" data-cat="release" aria-pressed="true">
          Releases
        </button>
        <button class="chip" data-cat="stack" aria-pressed="true">
          Your stack
        </button>
        <button class="chip" data-cat="discussion" aria-pressed="true">
          Discussion
        </button>
        <select id="guild" aria-label="Server"></select>
        <select id="run" aria-label="Run"></select>
        <label class="chip">min <span id="min"></span></label>
        <input
          type="search"
          id="q"
          placeholder="Search findings"
          aria-label="Search findings"
        />
      </div>
      <section class="overview" id="overview" hidden>
        <h2>Briefing</h2>
        <div id="overview-body"></div>
      </section>
      <div id="list"></div>
    </main>
    <nav class="hintbar" id="hints" aria-label="Keyboard shortcuts"></nav>

    <script id="data" type="application/json">
      /*DATA*/ null
    </script>
    <script>
      const DATA = JSON.parse(document.getElementById("data").textContent) || {
        minScore: 4,
        runs: [],
        findings: [],
      };
      const ALL = "all";
      const state = {
        mode: "NORMAL",
        cats: new Set(["release", "stack", "discussion"]),
        guild: ALL,
        run: DATA.runs[0] ? String(DATA.runs[0].id) : ALL,
        min: DATA.minScore,
        q: "",
        hideSeen: false,
        sel: 0,
      };

      const store = {
        get(k, d) {
          try {
            return JSON.parse(localStorage.getItem(k)) ?? d;
          } catch {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch {}
        },
      };
      const seen = new Set(store.get("seen", []));

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      };

      function link(f) {
        return `https://discord.com/channels/${f.guildId}/${f.channelId}/${f.messageIds[0]}`;
      }

      function visible() {
        const q = state.q.toLowerCase();
        return DATA.findings
          .filter(
            (f) =>
              state.cats.has(f.category) &&
              f.score >= state.min &&
              (state.guild === ALL || f.guild === state.guild) &&
              (state.run === ALL || String(f.run) === state.run) &&
              (!state.hideSeen || !seen.has(f.id)) &&
              (!q ||
                `${f.title} ${f.summary} ${f.why} ${f.guild} ${f.channel}`
                  .toLowerCase()
                  .includes(q)),
          )
          .sort((a, b) => b.score - a.score || b.at.localeCompare(a.at));
      }

      // Minimal, escape-first Markdown for the briefing: bullets, **bold**, `code`.
      function renderMarkdown(md, into) {
        into.replaceChildren();
        let ul = null;
        for (const raw of md.split("\n")) {
          const line = raw.trim();
          if (!line) {
            ul = null;
            continue;
          }
          const bullet = /^[-*]\s+/.test(line);
          const target = bullet
            ? (ul ??= into.appendChild(el("ul")))
            : into.appendChild(el("p"));
          const item = bullet ? target.appendChild(el("li")) : target;
          if (!bullet) ul = null;
          for (const part of line
            .replace(/^[-*]\s+/, "")
            .split(/(\*\*[^*]+\*\*|`[^`]+`)/)) {
            if (/^\*\*.*\*\*$/.test(part))
              item.appendChild(el("strong", null, part.slice(2, -2)));
            else if (/^`.*`$/.test(part))
              item.appendChild(el("code", null, part.slice(1, -1)));
            else if (part) item.appendChild(document.createTextNode(part));
          }
        }
      }

      function fmtDate(iso) {
        return new Date(iso).toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function render() {
        const items = visible();
        state.sel = Math.max(0, Math.min(state.sel, items.length - 1));

        const run = DATA.runs.find((r) => String(r.id) === state.run);
        $("sub").textContent = run
          ? `Run of ${fmtDate(run.started)} · ${run.stats.channels ?? "?"} channels, ${run.stats.messages ?? "?"} messages read · ${items.length} shown`
          : `All runs, last ${DATA.runs.length} · ${items.length} shown`;

        $("overview").hidden = !(run && run.overview);
        if (run && run.overview)
          renderMarkdown(run.overview, $("overview-body"));

        $("min").textContent = state.min;
        document
          .querySelectorAll(".chip[data-cat]")
          .forEach((c) =>
            c.setAttribute("aria-pressed", state.cats.has(c.dataset.cat)),
          );
        $("guild").value = state.guild;
        $("run").value = state.run;

        const list = $("list");
        list.replaceChildren();
        if (!items.length)
          list.appendChild(
            el(
              "div",
              "empty",
              "Nothing matches. Lower the minimum score or widen the filters.",
            ),
          );
        items.forEach((f, i) => {
          const card = el(
            "article",
            `finding cat-${f.category}` +
              (i === state.sel ? " selected" : "") +
              (seen.has(f.id) ? " seen" : ""),
          );
          const meta = card.appendChild(el("div", "meta"));
          meta.appendChild(
            el("span", "score" + (f.score >= 8 ? " hot" : ""), `${f.score}/10`),
          );
          meta.appendChild(el("span", "cat", f.category));
          meta.appendChild(el("span", null, `${f.guild} · #${f.channel}`));
          meta.appendChild(el("span", null, fmtDate(f.at)));
          card.appendChild(el("h3", null, f.title));
          card.appendChild(el("p", null, f.summary));
          card.appendChild(el("p", "why", f.why));
          const a = card.appendChild(el("a", null, "Open in Discord →"));
          a.href = link(f);
          a.target = "_blank";
          a.rel = "noopener";
          card.addEventListener("click", (e) => {
            if (e.target.tagName !== "A") {
              state.sel = i;
              render();
            }
          });
          list.appendChild(card);
        });
        list.querySelector(".selected")?.scrollIntoView({ block: "nearest" });
        renderHints();
      }

      const HINTS = {
        NORMAL: [
          ["j/k", "move"],
          ["o", "open"],
          ["x", "seen"],
          ["/", "search"],
          ["1 2 3", "categories", true],
          ["+/-", "min score"],
          ["s", "server", true],
          ["[ ]", "run", true],
          ["a", "all runs", true],
          ["h", "hide seen", true],
        ],
        SEARCH: [
          ["type", "filter"],
          ["Enter", "keep & leave"],
          ["Esc", "clear & leave"],
        ],
      };

      function renderHints() {
        const bar = $("hints");
        bar.replaceChildren(el("span", "mode", state.mode));
        for (const [k, label, opt] of HINTS[state.mode]) {
          const h = el("span", "hint" + (opt ? " opt" : ""));
          h.appendChild(el("kbd", null, k));
          h.appendChild(document.createTextNode(label));
          bar.appendChild(h);
        }
      }

      function setMode(m) {
        state.mode = m;
        if (m === "SEARCH") $("q").focus();
        else $("q").blur();
        renderHints();
      }

      function cycle(list, current, step) {
        const i = list.indexOf(current);
        return list[(i + step + list.length) % list.length];
      }

      function fillSelects() {
        const guilds = [
          ALL,
          ...new Set(DATA.findings.map((f) => f.guild)),
        ].sort((a, b) => (a === ALL ? -1 : a.localeCompare(b)));
        $("guild").replaceChildren(
          ...guilds.map((g) => {
            const o = el("option", null, g === ALL ? "All servers" : g);
            o.value = g;
            return o;
          }),
        );
        const runs = [...DATA.runs.map((r) => String(r.id)), ALL];
        $("run").replaceChildren(
          ...runs.map((id) => {
            const r = DATA.runs.find((x) => String(x.id) === id);
            const o = el("option", null, r ? fmtDate(r.started) : "All runs");
            o.value = id;
            return o;
          }),
        );
        return { guilds, runs };
      }

      const opts = fillSelects();
      const toggleSeen = (f) => {
        seen.has(f.id) ? seen.delete(f.id) : seen.add(f.id);
        store.set("seen", [...seen]);
      };

      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (state.mode === "SEARCH") {
          if (e.key === "Escape") {
            state.q = "";
            $("q").value = "";
            setMode("NORMAL");
            render();
          } else if (e.key === "Enter") setMode("NORMAL");
          return;
        }
        const items = visible();
        const f = items[state.sel];
        const actions = {
          j: () => state.sel++,
          ArrowDown: () => state.sel++,
          k: () => state.sel--,
          ArrowUp: () => state.sel--,
          o: () => f && window.open(link(f), "_blank", "noopener"),
          Enter: () => f && window.open(link(f), "_blank", "noopener"),
          x: () => f && toggleSeen(f),
          h: () => {
            state.hideSeen = !state.hideSeen;
          },
          "/": () => {
            setMode("SEARCH");
          },
          1: () => toggleCat("release"),
          2: () => toggleCat("stack"),
          3: () => toggleCat("discussion"),
          "+": () => {
            state.min = Math.min(10, state.min + 1);
          },
          "=": () => {
            state.min = Math.min(10, state.min + 1);
          },
          "-": () => {
            state.min = Math.max(1, state.min - 1);
          },
          s: () => {
            state.guild = cycle(opts.guilds, state.guild, 1);
            state.sel = 0;
          },
          S: () => {
            state.guild = cycle(opts.guilds, state.guild, -1);
            state.sel = 0;
          },
          "[": () => {
            state.run = cycle(opts.runs, state.run, 1);
            state.sel = 0;
          },
          "]": () => {
            state.run = cycle(opts.runs, state.run, -1);
            state.sel = 0;
          },
          a: () => {
            state.run = state.run === ALL ? (opts.runs[0] ?? ALL) : ALL;
            state.sel = 0;
          },
          Escape: () => {},
        };
        if (!(e.key in actions)) return;
        e.preventDefault();
        actions[e.key]();
        render();
      });

      function toggleCat(c) {
        state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
        state.sel = 0;
      }

      document.querySelectorAll(".chip[data-cat]").forEach((c) =>
        c.addEventListener("click", () => {
          toggleCat(c.dataset.cat);
          render();
        }),
      );
      $("guild").addEventListener("change", (e) => {
        state.guild = e.target.value;
        state.sel = 0;
        render();
      });
      $("run").addEventListener("change", (e) => {
        state.run = e.target.value;
        state.sel = 0;
        render();
      });
      $("q").addEventListener("input", (e) => {
        state.q = e.target.value;
        state.sel = 0;
        render();
      });
      $("q").addEventListener("focus", () => {
        if (state.mode !== "SEARCH") setMode("SEARCH");
      });
      $("q").addEventListener("blur", () => {
        if (state.mode === "SEARCH") {
          state.mode = "NORMAL";
          renderHints();
        }
      });

      render();
    </script>
  </body>
</html>
