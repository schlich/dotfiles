[project]
name = "discord-digest"
version = "0.1.0"
description = "Reads your Discord channels once a day and relays what looks worth your time to a dashboard"
readme = "README.md"
requires-python = ">=3.12"
# The floors are what nixpkgs ships; package.nix builds from it.
dependencies = [
    "anthropic>=1.8.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.0",
]

[project.scripts]
discord-digest = "discord_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_digest"]
