\* The ownership behavior before `state` and `jj-ci unclaim`: a task could
\* claim a repository's canonical checkout, and a stuck workspace was freed by
\* editing its record by hand. The jj-ci-model check runs TLC once per
\* invariant below and requires each run to report that invariant violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Heads = {h0, h1}
    MainHeads = {m0, m1}
    Legacy = TRUE

INVARIANTS
    ClaimOnlyWhileActive
    NoClaimOnSharedDefault
    DeliveredRecordIsTrue
