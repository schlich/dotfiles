[project]
name = "dotfiles"
revision = "1.0"

[providers]
keyring = "keyring://"

[profiles.default]
GITHUB_TOKEN = { description = "GitHub token used by Codex and OpenCode's GitHub MCP servers", required = true, providers = ["keyring"] }
JJ_CI_WEBHOOK_SECRET = { description = "HMAC secret for the GitHub workflow validation webhook", required = true, providers = ["keyring"] }

[scopes.jj-ci-webhook]
secrets = ["JJ_CI_WEBHOOK_SECRET"]
